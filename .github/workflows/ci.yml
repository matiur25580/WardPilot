name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start MongoDB replica set
        run: |
          docker run -d --name wardpilot-mongodb -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec wardpilot-mongodb mongosh --quiet --eval 'db.adminCommand("ping").ok' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec wardpilot-mongodb mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec wardpilot-mongodb mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary" >&2
          docker logs wardpilot-mongodb
          exit 1
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/wardpilot_test?replicaSet=rs0&directConnection=true
          WARDPILOT_INTEGRATION_TESTS: 'true'
      - name: Build
        run: npm run build
