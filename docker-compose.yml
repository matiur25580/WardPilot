services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [wardpilot_mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: { context: ., dockerfile: Dockerfile.api }
    environment:
      NODE_ENV: development
      API_PORT: 4000
      API_HOST: 0.0.0.0
      API_BASE_PATH: /api/v1
      CLIENT_ORIGIN: http://localhost:5173
      MONGODB_URI: mongodb://mongo:27017/wardpilot
    ports: ["4000:4000"]
    depends_on:
      mongo: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args: { VITE_API_BASE_URL: http://localhost:4000/api/v1 }
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  wardpilot_mongo_data:
